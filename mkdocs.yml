site_name: Animal Liberation Songbook
site_description: Songs, chords, lyrics and sheet music for the animal rights movement.
site_url: https://evachamer-proanimal.github.io/songbook/
repo_url: https://github.com/evachamer-proanimal/songbook
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: green
    accent: green
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: green
    accent: green
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.top
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.action.edit
  - toc.integrate
  icon:
    logo: material/music-note
extra_css:
- stylesheets/songbook.css
markdown_extensions:
- attr_list
- md_in_html
- tables
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences
- pymdownx.magiclink
- admonition
plugins:
- search
- awesome-nav
